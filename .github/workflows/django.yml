name: RedNet CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/rednet-website

jobs:
  # ── CI: проверки и тесты ──────────────────────────────────────────────────
  ci:
    name: CI — checks & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          DJANGO_SECRET_REDNET: ${{ secrets.DJANGO_SECRET_REDNET }}
        run: python manage.py check

      - name: Run tests
        env:
          DJANGO_SECRET_REDNET: ${{ secrets.DJANGO_SECRET_REDNET }}
        run: python manage.py test

  # ── Build & push Docker image ─────────────────────────────────────────────
  build:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  # ── Deploy на self-hosted runner (ноут / Virtuozzo PaaS) ──────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${{ env.IMAGE }}:latest

      - name: Restart container
        env:
          DJANGO_SECRET_REDNET: ${{ secrets.DJANGO_SECRET_REDNET }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
        run: docker compose up -d --pull always
