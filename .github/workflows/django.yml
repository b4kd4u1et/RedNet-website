name: RedNet CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── CI: проверки и тесты (GitHub cloud) ──────────────────────────────────
  ci:
    name: CI — checks & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          DJANGO_SECRET_REDNET: ${{ secrets.DJANGO_SECRET_REDNET }}
        run: python manage.py check

      - name: Collect static files
        env:
          DJANGO_SECRET_REDNET: ${{ secrets.DJANGO_SECRET_REDNET }}
        run: python manage.py collectstatic --noinput

      - name: Run tests
        env:
          DJANGO_SECRET_REDNET: ${{ secrets.DJANGO_SECRET_REDNET }}
        run: python manage.py test

  # ── CD: деплой на self-hosted runner (твой ноут / Virtuozzo PaaS) ─────────
  deploy:
    name: CD — deploy
    needs: ci
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect static files
        env:
          DJANGO_SECRET_REDNET: ${{ secrets.DJANGO_SECRET_REDNET }}
        run: python manage.py collectstatic --noinput

      - name: Restart Django (systemd)
        run: systemctl --user restart rednet.service
