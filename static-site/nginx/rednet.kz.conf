# /etc/nginx/sites-available/rednet.kz
# Статический сайт RedNet. Блог (blog.rednet.kz) обслуживается отдельно и здесь не настраивается.

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name rednet.kz www.rednet.kz;

    # Для выпуска/продления сертификата Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://rednet.kz$request_uri;
    }
}

# www → без www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # для nginx < 1.25.1: уберите эту строку и допишите "http2" в listen
    server_name www.rednet.kz;

    ssl_certificate     /etc/letsencrypt/live/rednet.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rednet.kz/privkey.pem;

    include /etc/nginx/snippets/rednet-security-headers.conf;
    return 301 https://rednet.kz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rednet.kz;

    root /var/www/rednet.kz;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/rednet.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rednet.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css image/svg+xml application/xml text/plain;

    include /etc/nginx/snippets/rednet-security-headers.conf;

    # Только GET/HEAD — бэкенда нет
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # /en и /ru без слэша → со слэшем
    location = /en { return 301 /en/; }
    location = /ru { return 301 /ru/; }

    # HTML — без долгого кэша, чтобы правки текста были видны сразу
    location ~* \.html$ {
        include /etc/nginx/snippets/rednet-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Статика. Имена файлов без хэшей, поэтому кэш умеренный (1 неделя).
    location ~* \.(css|svg|png|ico|xml|txt)$ {
        include /etc/nginx/snippets/rednet-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # Скрытые файлы (.git и т.п.) не отдаём
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}
