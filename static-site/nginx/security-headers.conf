# Заголовки безопасности для rednet.kz.
# Подключается через include в server и в КАЖДОМ location, где есть свой add_header:
# в nginx add_header внутри location отменяет все add_header уровня server.

# Сайт — только свои CSS и картинки: без JS, без inline-стилей, без внешних ресурсов.
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# HSTS: сначала проверьте, что HTTPS работает на всех поддоменах (включая blog.rednet.kz),
# иначе уберите includeSubDomains. preload добавляйте только осознанно (hstspreload.org).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
